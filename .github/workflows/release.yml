name: release

# A push to main that bumps CFBundleShortVersionString in Resources/Info.plist
# tests, builds, packages and publishes that version as a GitHub Release, and
# tags it vX.Y.Z. Pushing a vX.Y.Z tag by hand does the same for that tag.
# Running it manually (workflow_dispatch) builds the same artifacts and attaches
# them to the run instead of publishing.
#
# Optional repository secrets; without them the app is ad-hoc signed:
#   MACOS_CERTIFICATE_P12       base64 of a .p12 with a code signing identity
#                               (the self-signed one `make signing-identity`
#                               stores, Apple Development or Developer ID
#                               Application)
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   NOTARY_APPLE_ID             Apple ID for notarization
#   NOTARY_TEAM_ID              Apple Developer team ID
#   NOTARY_PASSWORD             app-specific password of that Apple ID
# Notarization runs only when all three NOTARY_* secrets are set, and only
# succeeds with a Developer ID Application certificate.
#
# Required for publishing (publishing fails without it):
#   SPARKLE_PRIVATE_KEY         EdDSA key that signs the update feed; it must
#                               match SUPublicEDKey in Resources/Info.plist.
#                               Export it with Sparkle's generate_keys -x.

on:
  push:
    branches:
      - main
    # Only commits that may bump the version; tag pushes ignore path filters.
    paths:
      - Resources/Info.plist
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build without creating a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, so a version bump and a tag pushed for it cannot both
# publish: whichever runs second finds the tag.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: version
    # Reads Info.plist and the tags only. GitHub-hosted: the repository has no
    # self-hosted runners, and hosted ones cost nothing on a public repository.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          build=true
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # A manual run on a tag publishes only with dry_run off.
            if [[ "$GITHUB_EVENT_NAME" == push || "$DRY_RUN" == false ]]; then publish=true; fi
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')"
            status=0
            git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/v$version" >/dev/null || status=$?
            case "$status" in
              0)
                echo "::notice::v$version is already tagged: Info.plist changed without a version bump, nothing to release"
                build=false
                ;;
              2) publish=true ;;
              *)
                echo "::error::could not list the tags of $GITHUB_REPOSITORY (git ls-remote exited with $status)"
                exit 1
                ;;
            esac
          else
            version="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$version is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-PRERELEASE"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $version (prerelease: $prerelease, build: $build, publish: $publish)"

  release:
    name: build + publish
    needs: version
    if: needs.version.outputs.build == 'true'
    # GitHub-hosted on purpose: the self-hosted runners are Linux-only, and this
    # needs macOS with Xcode. Same Xcode build (27.0, 27A266a) as local
    # development. xcode-27 is a GitHub public preview label; move to macos-27
    # once it is generally available.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write  # create the GitHub Release and its tag
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_TEAM_ID != '' && secrets.NOTARY_PASSWORD != '' }}
      PUBLISH: ${{ needs.version.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the build number is the commit count

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Reject duplicate release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"
            exit 1
          fi

      - name: Test
        run: make test

      - name: Import signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          # Not only valid (Apple-trusted) identities: the self-signed one from
          # `make signing-identity` is untrusted, yet signs just as well.
          identity="$(security find-identity -p codesigning "$keychain" | awk '/^ *[0-9]+\)/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERTIFICATE_P12 holds no code signing identity"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          timestamp="--timestamp=none"
          if [[ "$HAS_CERTIFICATE" == "true" && "$HAS_NOTARY" == "true" ]]; then timestamp="--timestamp"; fi
          make app VERSION="$VERSION" CODESIGN_TIMESTAMP="$timestamp"

      - name: Verify bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          codesign --verify --deep --strict --verbose=2 build/Cuadro.app
          bundled="$(plutil -extract CFBundleShortVersionString raw build/Cuadro.app/Contents/Info.plist)"
          if [[ "$bundled" != "$VERSION" ]]; then
            echo "::error::bundle version $bundled does not match $VERSION"
            exit 1
          fi
          lipo -archs build/Cuadro.app/Contents/MacOS/Cuadro

      - name: Notarize
        if: env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: make notarize

      - name: Smoke test
        # Launches the release build, which also proves the embedded
        # Sparkle.framework loads: opens the editor, settings, onboarding, a
        # pin and the selection overlay on a synthetic screenshot, renders each
        # window to PNG and quits.
        timeout-minutes: 5
        run: |
          output="$RUNNER_TEMP/ui-snapshot"
          build/Cuadro.app/Contents/MacOS/Cuadro --ui-snapshot "$output"
          count="$(find "$output" -name '*.png' | wc -l | tr -d ' ')"
          echo "Rendered $count windows"
          if (( count < 5 )); then
            echo "::error::smoke test rendered only $count windows"
            exit 1
          fi
          # A zero-size welcome window renders nothing; it once hid every permission request.
          if ! find "$output" -name '*Welcome to Cuadro*.png' | grep -q .; then
            echo "::error::smoke test did not render the welcome window"
            exit 1
          fi

      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet --disable-pip-version-check -r .github/dmg-requirements.txt
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: make dist VERSION="$VERSION"

      - name: Release notes
        # The same notes go to the GitHub Release and into the update window.
        # A version bump on main has no tag yet: the notes run up to its commit.
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body \
            > "build/dist/cuadro-$VERSION-macos-$(uname -m).md"

      - name: Update feed
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            if [[ "$PUBLISH" == "true" ]]; then
              echo "::error::SPARKLE_PRIVATE_KEY is not set; a release without a signed appcast.xml breaks in-app updates"
              exit 1
            fi
            echo "::notice::SPARKLE_PRIVATE_KEY is not set; skipping the update feed"
            exit 0
          fi
          make appcast VERSION="$VERSION"

      - name: Publish GitHub Release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--title "$TAG" --notes-file build/dist/*.md)
          # A pushed tag must exist; a version bump on main gets its tag here.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$GITHUB_SHA")
          fi
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" build/dist/*.zip build/dist/*.dmg build/dist/SHA256SUMS build/dist/appcast.xml

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cuadro-${{ needs.version.outputs.version }}
          path: build/dist/
          retention-days: 14

      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"
